<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SGA PRO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: hsl(210, 100%, 20%);
            --primary-light: hsl(210, 100%, 30%);
            --accent: hsl(197, 100%, 45%);
            --gradient: linear-gradient(135deg, hsl(210, 100%, 18%) 0%, hsl(210, 85%, 35%) 50%, hsl(197, 90%, 45%) 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveBackground 20s linear infinite;
        }

        @keyframes moveBackground {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(50px, 50px);
            }
        }

        .login-container {
            position: relative;
            z-index: 1;
            max-width: 450px;
            width: 90%;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .login-header {
            background: var(--gradient);
            color: white;
            padding: 3rem 2rem 2rem;
            text-align: center;
        }

        .login-header .logo-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .login-header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .login-header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .login-body {
            padding: 2.5rem 2rem;
        }

        .form-floating {
            margin-bottom: 1.5rem;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 0.875rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0, 168, 232, 0.1);
        }

        .input-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 1.1rem;
        }

        .btn-login {
            width: 100%;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            background: var(--gradient);
            border: none;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-login:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert {
            border-radius: 10px;
            border: none;
            margin-bottom: 1.5rem;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-footer {
            text-align: center;
            padding: 1.5rem 2rem;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }

        .login-footer small {
            color: #666;
        }

        .spinner-border {
            display: none;
            width: 1.2rem;
            height: 1.2rem;
            margin-right: 0.5rem;
        }

        .btn-login.loading .spinner-border {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .login-header {
                padding: 2rem 1.5rem 1.5rem;
            }

            .login-header h1 {
                font-size: 1.75rem;
            }

            .login-body {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">
                    <i class="fas fa-industry"></i>
                </div>
                <h1>SGA PRO</h1>
                <p>Sistema de Gestión de Almacén</p>
            </div>

            <div class="login-body">
                <div id="alertDiv"></div>

                <form id="loginForm">
                    <div class="form-floating position-relative">
                        <input type="text" class="form-control" id="username" placeholder="Usuario" required autofocus>
                        <label for="username">Usuario</label>
                        <i class="fas fa-user input-icon"></i>
                    </div>

                    <div class="form-floating position-relative mb-4">
                        <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
                        <label for="password">Contraseña</label>
                        <i class="fas fa-lock input-icon"></i>
                    </div>

                    <button type="submit" class="btn btn-login" id="btnLogin">
                        <span class="spinner-border spinner-border-sm"></span>
                        <span class="btn-text">
                            <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                        </span>
                        <span class="d-none">Ingresando...</span>
                    </button>
                </form>
            </div>

            <div class="login-footer">
                <small><i class="fas fa-shield-alt me-1"></i> Acceso seguro · &copy; 2025       ING. HERNAN ALVA
                </small>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btnLogin = document.getElementById('btnLogin');
            const alertDiv = document.getElementById('alertDiv');

            // Limpiar alertas
            alertDiv.innerHTML = '';

            // Validación
            if (!username || !password) {
                showAlert('Por favor complete todos los campos', 'warning');
                return;
            }

            // Loading state
            btnLogin.classList.add('loading');
            btnLogin.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Guardar token y datos de usuario
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    showAlert('¡Login exitoso! Redirigiendo...', 'success');

                    // Redireccionar al dashboard
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);

                } else {
                    showAlert(data.message || 'Credenciales inválidas', 'danger');
                }

            } catch (error) {
                console.error('Error en login:', error);
                showAlert('Error de conexión. Intente nuevamente.', 'danger');
            } finally {
                btnLogin.classList.remove('loading');
                btnLogin.disabled = false;
            }
        });

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertDiv');
            const iconMap = {
                success: 'check-circle',
                danger: 'exclamation-circle',
                warning: 'exclamation-triangle'
            };

            alertDiv.innerHTML = `
                <div class="alert alert-${type} d-flex align-items-center" role="alert">
                    <i class="fas fa-${iconMap[type]} me-2"></i>
                    <div>${message}</div>
                </div>
            `;

            // Auto-hide success alerts
            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.innerHTML = '';
                }, 3000);
            }
        }

        // Verificar si ya está logueado
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            if (token) {
                // Validar token (opcional)
                window.location.href = '/';
            }
        });
    </script>
</body>

</html>
